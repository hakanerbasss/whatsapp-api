<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sohbet — WhatsApp API</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#25D366">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WA Panel">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<style>
:root{--bg:#0a0e14;--surface:#0f1419;--card:#111820;--border:#1e2733;--accent:#25D366;--accent2:#00d4ff;--red:#ff4444;--yellow:#ffd700;--text:#e8f4f8;--muted:#4a6070;--bubble-out:rgba(37,211,102,.16);--bubble-in:#161e28;}
[data-theme="light"]{--bg:#f0f4f8;--surface:#ffffff;--card:#ffffff;--border:#dde3ea;--accent:#25D366;--accent2:#0088cc;--red:#dc3545;--yellow:#f59e0b;--text:#1a2332;--muted:#6b7280;--bubble-out:#d9fdd3;--bubble-in:#ffffff;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;}
button{font-family:inherit;}
input,textarea{font-family:inherit;}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:380px;text-align:center;}
.login-box input{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;outline:none;}

.chat-app{display:flex;height:100vh;}
.sidebar{width:380px;min-width:300px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);}
.sb-header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);}
.sb-header h1{font-size:17px;font-weight:800;flex:1;}
.icon-btn{width:34px;height:34px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.icon-btn:hover{border-color:var(--accent2);color:var(--accent2);}
.back-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:17px;text-decoration:none;flex-shrink:0;}
.sb-search{padding:10px 12px;border-bottom:1px solid var(--border);}
.sb-search input{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:13px;outline:none;}
.sb-search input:focus{border-color:var(--accent);}
.conv-list{flex:1;overflow-y:auto;}
/* Alt gezinme — Hesabım/Toplu Mesaj her zaman erişilebilir kalsın; sidebar zaten tam yükseklik
   flex kolon olduğu için sabitlemeye (position:fixed) gerek yok, en altta normal akışta durur. */
.bottom-nav{display:flex;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:9px 0 7px;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:700;cursor:pointer;border:none;background:none;font-family:inherit;}
.bn-item .bn-icon{font-size:18px;}
.bn-item.active{color:var(--accent);}
.conv-item{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid rgba(30,39,51,.4);transition:background .15s;}
.conv-item:hover,.conv-item.active{background:rgba(37,211,102,.08);}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;}
.conv-info{flex:1;min-width:0;}
.conv-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
.conv-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv-time{font-size:11px;color:var(--muted);flex-shrink:0;}
.conv-prev{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.conv-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
.unread-badge{background:var(--accent);color:#000;font-size:11px;font-weight:800;border-radius:10px;min-width:19px;height:19px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.empty-hint{text-align:center;color:var(--muted);padding:30px 16px;font-size:13px;line-height:1.7;}

.conv-pane{flex:1;display:flex;flex-direction:column;background:var(--bg);}
.conv-pane.empty{align-items:center;justify-content:center;color:var(--muted);font-size:14px;}
.cp-header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface);}
.cp-header .conv-info{flex:1;}
.cp-name{font-size:15px;font-weight:700;}
.cp-phone{font-size:11px;color:var(--muted);font-family:monospace;}
.msgs{flex:1;overflow-y:auto;padding:14px 4%;display:flex;flex-direction:column;gap:2px;}
.bubble-row{display:flex;}
.bubble-row.out{justify-content:flex-end;}
.bubble{max-width:72%;padding:7px 9px 6px;border-radius:10px;font-size:14px;line-height:1.4;position:relative;margin:2px 0;word-wrap:break-word;}
.bubble.in{background:var(--bubble-in);border:1px solid var(--border);border-top-left-radius:2px;}
.bubble.out{background:var(--bubble-out);border-top-right-radius:2px;}
.bubble img,.bubble video{max-width:100%;border-radius:6px;display:block;cursor:pointer;}
.bubble audio{width:230px;}
.bubble .doc-card{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border-radius:6px;padding:8px;text-decoration:none;color:var(--text);}
.bubble .cap{margin-top:4px;}
.bubble .meta{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);margin-top:3px;}
.bubble .meta .tick{font-size:12px;}
.bubble .meta .tick.read{color:var(--accent2);}
.bubble .meta .tick.failed{color:var(--red);}
.day-sep{text-align:center;color:var(--muted);font-size:11px;margin:12px 0 4px;}
.media-missing{color:var(--muted);font-size:12px;font-style:italic;}

.input-bar{display:flex;align-items:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--surface);}
.input-bar textarea{flex:1;resize:none;max-height:100px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:9px 14px;font-size:14px;outline:none;line-height:1.4;}
.input-bar textarea:focus{border-color:var(--accent);}
.round-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--accent);color:#000;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.round-btn.ghost{background:var(--card);color:var(--muted);border:1px solid var(--border);}
.round-btn.rec{background:var(--red);color:#fff;}
.attach-preview{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border-top:1px solid var(--border);font-size:12px;}
.attach-preview img{width:40px;height:40px;object-fit:cover;border-radius:6px;}
.rec-ui{display:flex;align-items:center;gap:10px;flex:1;padding:0 8px;font-size:13px;color:var(--red);}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;width:100%;max-width:380px;}
.modal h3{margin-bottom:14px;font-size:16px;}
.modal label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
.modal input{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;outline:none;margin-bottom:10px;}
.btn{padding:9px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;}
.btn-primary{background:var(--accent);color:#000;width:100%;}
.btn-ghost{background:var(--surface);color:var(--muted);border:1px solid var(--border);width:100%;margin-top:6px;}
.modal-err{color:var(--red);font-size:12px;margin-top:6px;min-height:14px;}
.nc-tabs{display:flex;gap:4px;margin-bottom:14px;background:var(--surface);border-radius:8px;padding:4px;}
.nc-tab{flex:1;padding:7px;border-radius:6px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:12.5px;transition:all .2s;}
.nc-tab.active{background:var(--card);color:var(--text);font-weight:600;}
.pick-list{max-height:260px;overflow-y:auto;margin-top:4px;}
.pick-list .conv-item{border-radius:8px;}

@media (max-width:760px){
  .sidebar{width:100%;}
  .conv-pane{display:none;position:fixed;inset:0;z-index:40;}
  body.show-conv .sidebar{display:none;}
  body.show-conv .conv-pane{display:flex;}
  .cp-back{display:inline-flex !important;}
}
.cp-back{display:none;}
</style>
</head>
<body>

<div id="login-wrap" class="login-wrap" style="display:none">
  <div class="login-box">
    <div style="font-size:48px;margin-bottom:12px">💬</div>
    <h2 style="margin-bottom:6px">Sohbet</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:20px">API Token ile giriş yapın</p>
    <input type="text" id="login-token" placeholder="Token...">
    <button onclick="loginWithToken()" style="width:100%;margin-top:8px;padding:12px;border-radius:10px;border:none;background:var(--accent);color:#000;font-size:15px;font-weight:700;cursor:pointer">Giriş</button>
    <div id="login-err" style="color:var(--red);font-size:12px;margin-top:8px"></div>
  </div>
</div>

<div id="app" class="chat-app" style="display:none">
  <div class="sidebar">
    <div class="sb-header">
      <a href="/musteri" id="back-link" class="back-btn" title="Geri">←</a>
      <h1>💬 Sohbet</h1>
      <button class="icon-btn" onclick="openNewChatModal()" title="Yeni Sohbet">➕</button>
      <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Tema">🌙</button>
    </div>
    <div class="sb-search"><input type="text" id="conv-search" placeholder="🔍 İsim veya numara ara..." oninput="renderConvList()"></div>
    <div class="conv-list" id="conv-list">
      <div class="empty-hint">Yükleniyor...</div>
    </div>
    <nav class="bottom-nav">
      <a id="bn-hesabim" href="/musteri" class="bn-item"><span class="bn-icon">🏠</span>Hesabım</a>
      <span class="bn-item active"><span class="bn-icon">💬</span>Sohbet</span>
      <a id="bn-toplu" href="/toplu" class="bn-item"><span class="bn-icon">📤</span>Toplu Mesaj</a>
    </nav>
  </div>

  <div class="conv-pane empty" id="conv-pane">
    <div>👈 Sohbet etmek için soldan bir kişi seçin ya da ➕ ile yeni sohbet başlatın</div>
  </div>
</div>

<!-- Yeni Sohbet / Kişi Ekle Modal -->
<div id="new-chat-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeNewChatModal()">
  <div class="modal">
    <h3>➕ Yeni Sohbet</h3>
    <div class="nc-tabs">
      <button class="nc-tab active" id="nc-tab-pick" onclick="setNcTab('pick')">📋 Rehberden Seç</button>
      <button class="nc-tab" id="nc-tab-manual" onclick="setNcTab('manual')">✍️ Manuel Ekle</button>
    </div>
    <div id="nc-pick-pane">
      <input type="text" id="nc-pick-search" placeholder="🔍 İsim veya numara ara..." oninput="renderPickList()">
      <div class="pick-list" id="nc-pick-list"></div>
    </div>
    <div id="nc-manual-pane" style="display:none">
      <label>Ad Soyad *</label>
      <input type="text" id="nc-name" placeholder="Ahmet Yılmaz">
      <label>Telefon * (905551234567)</label>
      <input type="tel" id="nc-phone" placeholder="905551234567">
      <button class="btn btn-primary" onclick="createNewChat()">Ekle ve Sohbet Başlat</button>
    </div>
    <button class="btn btn-ghost" onclick="closeNewChatModal()">Vazgeç</button>
    <div class="modal-err" id="nc-err"></div>
  </div>
</div>

<script>
function copyToClipboard(text){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));}else{fallbackCopy(text);}}
function fallbackCopy(text){var el=document.createElement("textarea");el.value=text;el.style.position="fixed";el.style.opacity="0";document.body.appendChild(el);el.focus();el.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(el);}

let currentToken = '';
let conversations = [];
let activePhone = null;
let activeName = null;
let lastMsgId = 0;
let lastRenderedDay = null;
let msgPollTimer = null;
let listPollTimer = null;
let nearBottom = true;
let mediaRecorder = null, recordChunks = [], recordInterval = null, recSecs = 0;
let pendingFile = null;

window.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('theme-btn').textContent = savedTheme === 'light' ? '☀️' : '🌙';

  const urlToken = new URLSearchParams(window.location.search).get('token');
  const savedToken = localStorage.getItem('wa_customer_token');
  const token = urlToken || savedToken;
  if (token) {
    currentToken = token;
    document.getElementById('back-link').href = '/musteri?token=' + token;
    document.getElementById('bn-hesabim').href = '/musteri?token=' + token;
    document.getElementById('bn-toplu').href = '/toplu?token=' + token;
    document.getElementById('app').style.display = 'flex';
    boot();
  } else {
    document.getElementById('login-wrap').style.display = 'flex';
  }
});

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('theme-btn').textContent = next === 'light' ? '☀️' : '🌙';
  localStorage.setItem('theme', next);
}

async function loginWithToken() {
  const token = document.getElementById('login-token').value.trim();
  if (!token) return;
  const r = await fetch('/api/status', { headers: { 'x-api-token': token } });
  const data = await r.json();
  if (data.error) { document.getElementById('login-err').textContent = '❌ Geçersiz token'; return; }
  currentToken = token;
  localStorage.setItem('wa_customer_token', token);
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('back-link').href = '/musteri?token=' + token;
  document.getElementById('bn-hesabim').href = '/musteri?token=' + token;
  document.getElementById('bn-toplu').href = '/toplu?token=' + token;
  boot();
}

function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers, { 'x-api-token': currentToken });
  return fetch(path, opts).then(r => r.json());
}

// Rehber eskiden tarayıcıda (localStorage) saklanıyordu. Sunucuya taşıdıktan sonra, daha önce
// o tarayıcıda kaydedilmiş kişiler görünmez olmasın diye bir kerelik otomatik aktarım yapılır.
async function migrateLegacyContacts() {
  const raw = localStorage.getItem('wa_contacts');
  if (!raw) return;
  try {
    const legacy = JSON.parse(raw);
    const toAdd = Array.isArray(legacy) ? legacy.map(c => ({ name: c.name, phone: c.phone })).filter(c => c.name && c.phone) : [];
    if (toAdd.length) await api('/api/contacts/bulk', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contacts: toAdd }) });
  } catch(e) {}
  localStorage.removeItem('wa_contacts');
}

async function boot() {
  await migrateLegacyContacts();
  loadConversations();
  listPollTimer = setInterval(loadConversations, 4000);
}

// ── SOHBET LİSTESİ ───────────────────────────────────────────────
async function loadConversations() {
  try {
    const data = await api('/api/chat/conversations');
    if (!data.ok) return;
    conversations = data.conversations;
    renderConvList();
  } catch(e) {}
}

function timeLabel(iso) {
  if (!iso) return '';
  const d = new Date(iso.replace(' ', 'T') + 'Z');
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  const diffDays = Math.round((now - d) / 86400000);
  if (diffDays === 1) return 'Dün';
  if (diffDays < 7) return d.toLocaleDateString('tr-TR', { weekday: 'short' });
  return d.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit' });
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function previewText(c) {
  if (!c.last_at) return 'Henüz mesaj yok — yazmaya başlayın';
  const prefix = c.last_direction === 'out' ? '✓ ' : '';
  const icons = { image: '📷 Fotoğraf', video: '🎬 Video', audio: '🎤 Sesli mesaj', document: '📄 Belge', location: '📍 Konum', contact: '👤 Kişi', sticker: '🌟 Çıkartma' };
  const bodyEsc = esc(c.last_body || '');
  if (c.last_type && icons[c.last_type]) return prefix + icons[c.last_type] + (bodyEsc ? ' — ' + bodyEsc : '');
  return prefix + bodyEsc;
}

function avatarLetter(c) {
  if (c.name) return esc(c.name.trim()[0].toUpperCase());
  return esc((c.phone || '?').slice(-2));
}

function renderConvList() {
  const q = (document.getElementById('conv-search').value || '').trim().toLocaleLowerCase('tr');
  const el = document.getElementById('conv-list');
  let list = conversations;
  if (q) list = list.filter(c => (c.name || '').toLocaleLowerCase('tr').includes(q) || c.phone.includes(q));

  if (!list.length) {
    el.innerHTML = '<div class="empty-hint">Henüz sohbet yok.<br>➕ ile yeni sohbet başlatın veya Rehber\'den kişi ekleyin.</div>';
    return;
  }

  el.innerHTML = list.map(c => `
    <div class="conv-item ${c.phone === activePhone ? 'active' : ''}" onclick="openConversation('${c.phone}')">
      <div class="avatar">${avatarLetter(c)}</div>
      <div class="conv-info">
        <div class="conv-top">
          <div class="conv-name">${esc(c.name || c.phone)}</div>
          <div class="conv-time">${timeLabel(c.last_at)}</div>
        </div>
        <div class="conv-bottom">
          <div class="conv-prev">${previewText(c)}</div>
          ${c.unread > 0 ? `<span class="unread-badge">${c.unread}</span>` : ''}
        </div>
      </div>
    </div>`).join('');
}

// ── KONUŞMA AÇ ───────────────────────────────────────────────────
function openConversation(phone) {
  const conv = conversations.find(c => c.phone === phone);
  const name = conv ? conv.name : null;
  activePhone = phone;
  activeName = name || null;
  lastMsgId = 0;
  lastRenderedDay = null;
  document.body.classList.add('show-conv');
  clearInterval(msgPollTimer);

  const pane = document.getElementById('conv-pane');
  pane.classList.remove('empty');
  pane.innerHTML = `
    <div class="cp-header">
      <button class="icon-btn cp-back" onclick="closeConversation()" title="Geri">←</button>
      <div class="avatar">${esc((name || phone).trim()[0]?.toUpperCase() || '?')}</div>
      <div class="conv-info">
        <div class="cp-name">${esc(name || phone)}</div>
        <div class="cp-phone">${esc(phone)}</div>
      </div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div id="attach-preview-slot"></div>
    <div class="input-bar" id="input-bar">
      <textarea id="msg-input" rows="1" placeholder="Mesaj yazın..." oninput="onInputChange()" onkeydown="onInputKeydown(event)"></textarea>
      <input type="file" id="file-input" style="display:none" accept="image/*,video/*,audio/*,application/pdf,.doc,.docx,.xls,.xlsx,.txt" onchange="onFileSelect(this)">
      <button class="round-btn ghost" id="attach-btn" onclick="document.getElementById('file-input').click()" title="Ekle">📎</button>
      <button class="round-btn" id="send-btn" onclick="sendCurrent()" title="Gönder">🎙</button>
    </div>`;

  document.getElementById('msgs').addEventListener('scroll', () => {
    const m = document.getElementById('msgs');
    nearBottom = (m.scrollHeight - m.scrollTop - m.clientHeight) < 80;
  });

  renderConvList();
  loadHistory();
  api('/api/chat/' + phone + '/read', { method: 'POST' });
  msgPollTimer = setInterval(pollMessages, 2500);
}

function closeConversation() {
  document.body.classList.remove('show-conv');
}

async function loadHistory() {
  const m = document.getElementById('msgs');
  m.innerHTML = '<div class="empty-hint">Yükleniyor...</div>';
  const data = await api('/api/chat/' + activePhone + '?limit=50');
  if (!data.ok) { m.innerHTML = '<div class="empty-hint">Geçmiş yüklenemedi</div>'; return; }
  m.innerHTML = '';
  lastRenderedDay = null;
  data.messages.forEach(row => renderBubble(row));
  lastMsgId = data.messages.length ? data.messages[data.messages.length - 1].id : 0;
  m.scrollTop = m.scrollHeight;
}

async function pollMessages() {
  if (!activePhone) return;
  const data = await api('/api/chat/' + activePhone + '?limit=40');
  if (!data.ok) return;
  const m = document.getElementById('msgs');
  if (!m) return;
  const wasNearBottom = nearBottom;
  data.messages.forEach(row => {
    const existing = document.getElementById('msg-' + row.id);
    if (existing) updateBubbleStatus(existing, row);
    else renderBubble(row);
  });
  const newLast = data.messages.length ? data.messages[data.messages.length - 1].id : lastMsgId;
  if (newLast > lastMsgId) {
    lastMsgId = newLast;
    if (wasNearBottom) m.scrollTop = m.scrollHeight;
  }
}

function dayLabel(iso) {
  const d = new Date(iso.replace(' ', 'T') + 'Z');
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return 'Bugün';
  const diffDays = Math.round((now - d) / 86400000);
  if (diffDays === 1) return 'Dün';
  return d.toLocaleDateString('tr-TR', { day: '2-digit', month: 'long', year: 'numeric' });
}

function tickHtml(row) {
  if (row.direction !== 'out') return '';
  if (row.status === 'failed') return '<span class="tick failed">⚠</span>';
  if (row.status === 'read') return '<span class="tick read">✓✓</span>';
  if (row.status === 'delivered') return '<span class="tick">✓✓</span>';
  return '<span class="tick">✓</span>';
}

function mediaHtml(row) {
  if (!row.media_path) return row.message_type !== 'text' ? '<div class="media-missing">⚠️ medya indirilemedi</div>' : '';
  const src = '/api/chat/media/' + row.media_path + '?token=' + encodeURIComponent(currentToken);
  if (row.message_type === 'image' || row.message_type === 'sticker') return `<img src="${src}" onclick="window.open('${src}','_blank')">`;
  if (row.message_type === 'video') return `<video src="${src}" controls></video>`;
  if (row.message_type === 'audio') return `<audio src="${src}" controls></audio>`;
  if (row.message_type === 'document') return `<a class="doc-card" href="${src}" target="_blank">📄 <span>Belgeyi Aç / İndir</span></a>`;
  return '';
}

function renderBubble(row) {
  const m = document.getElementById('msgs');
  const day = dayLabel(row.created_at);
  let html = '';
  if (day !== lastRenderedDay) { html += `<div class="day-sep">${day}</div>`; lastRenderedDay = day; }
  const time = new Date(row.created_at.replace(' ', 'T') + 'Z').toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  let bodyBlock = '';
  if (row.message_type === 'location') bodyBlock = '📍 Konum paylaşıldı';
  else if (row.message_type === 'contact') bodyBlock = '👤 Kişi kartı paylaşıldı';
  else if (row.body) bodyBlock = esc(row.body);
  html += `
    <div class="bubble-row ${row.direction}">
      <div class="bubble ${row.direction}" id="msg-${row.id}">
        ${mediaHtml(row)}
        ${bodyBlock ? `<div class="cap">${bodyBlock}</div>` : ''}
        <div class="meta"><span>${time}</span>${tickHtml(row)}</div>
      </div>
    </div>`;
  m.insertAdjacentHTML('beforeend', html);
}

function updateBubbleStatus(el, row) {
  const meta = el.querySelector('.meta');
  if (!meta) return;
  const time = new Date(row.created_at.replace(' ', 'T') + 'Z').toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  meta.innerHTML = `<span>${time}</span>${tickHtml(row)}`;
}

// ── GÖNDERİM ─────────────────────────────────────────────────────
function onInputChange() {
  const v = document.getElementById('msg-input').value;
  document.getElementById('send-btn').textContent = (v.trim() || pendingFile) ? '➤' : '🎙';
  const ta = document.getElementById('msg-input');
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 100) + 'px';
}

function onInputKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendCurrent(); }
}

function onFileSelect(input) {
  const file = input.files[0];
  if (!file) return;
  pendingFile = file;
  const slot = document.getElementById('attach-preview-slot');
  const isImg = file.type.startsWith('image/');
  slot.innerHTML = `<div class="attach-preview">
    ${isImg ? `<img src="${URL.createObjectURL(file)}">` : '📄'}
    <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${file.name}</span>
    <button class="icon-btn" onclick="cancelAttach()">✕</button>
  </div>`;
  onInputChange();
}

function cancelAttach() {
  pendingFile = null;
  document.getElementById('attach-preview-slot').innerHTML = '';
  document.getElementById('file-input').value = '';
  onInputChange();
}

async function sendCurrent() {
  const btn = document.getElementById('send-btn');
  const text = document.getElementById('msg-input').value.trim();

  if (!text && !pendingFile) { toggleRecord(); return; }

  btn.disabled = true;
  try {
    const fd = new FormData();
    if (pendingFile) {
      fd.append('file', pendingFile);
      if (text) fd.append('text', text);
    } else {
      fd.append('text', text);
    }
    const r = await fetch('/api/chat/' + activePhone + '/send', { method: 'POST', headers: { 'x-api-token': currentToken }, body: fd });
    const data = await r.json();
    if (!data.ok) { alert('❌ ' + (data.error || 'Gönderilemedi')); btn.disabled = false; return; }
    renderBubble(data.message);
    lastMsgId = Math.max(lastMsgId, data.message.id);
    document.getElementById('msg-input').value = '';
    cancelAttach();
    onInputChange();
    const m = document.getElementById('msgs');
    m.scrollTop = m.scrollHeight;
    loadConversations();
  } catch(e) {
    alert('❌ Gönderme hatası: ' + e.message);
  }
  btn.disabled = false;
}

// ── SESLİ MESAJ ──────────────────────────────────────────────────
async function toggleRecord() {
  if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recordInterval);
      restoreInputBar();
      const blob = new Blob(recordChunks, { type: 'audio/ogg; codecs=opus' });
      if (blob.size < 500) return; // çok kısa / iptal
      const fd = new FormData();
      fd.append('file', blob, 'ses-kaydi.ogg');
      fd.append('ptt', 'true');
      const r = await fetch('/api/chat/' + activePhone + '/send', { method: 'POST', headers: { 'x-api-token': currentToken }, body: fd });
      const data = await r.json();
      if (!data.ok) { alert('❌ ' + (data.error || 'Gönderilemedi')); return; }
      renderBubble(data.message);
      lastMsgId = Math.max(lastMsgId, data.message.id);
      document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
      loadConversations();
    };
    mediaRecorder.start();
    recSecs = 0;
    const bar = document.getElementById('input-bar');
    bar.innerHTML = `
      <div class="rec-ui">🔴 Kaydediliyor... <span id="rec-timer">0:00</span></div>
      <button class="round-btn ghost" onclick="cancelRecord()" title="İptal">✕</button>
      <button class="round-btn rec" onclick="toggleRecord()" title="Gönder">➤</button>`;
    recordInterval = setInterval(() => {
      recSecs++;
      const timerEl = document.getElementById('rec-timer');
      if (timerEl) timerEl.textContent = Math.floor(recSecs / 60) + ':' + (recSecs % 60).toString().padStart(2, '0');
    }, 1000);
  } catch(e) {
    alert('❌ Mikrofon erişimi reddedildi');
  }
}

function cancelRecord() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    recordChunks = [];
    mediaRecorder.onstop = () => { mediaRecorder.stream?.getTracks().forEach(t => t.stop()); clearInterval(recordInterval); restoreInputBar(); };
    mediaRecorder.stop();
  }
}

function restoreInputBar() {
  const bar = document.getElementById('input-bar');
  if (!bar) return;
  bar.innerHTML = `
    <textarea id="msg-input" rows="1" placeholder="Mesaj yazın..." oninput="onInputChange()" onkeydown="onInputKeydown(event)"></textarea>
    <input type="file" id="file-input" style="display:none" accept="image/*,video/*,audio/*,application/pdf,.doc,.docx,.xls,.xlsx,.txt" onchange="onFileSelect(this)">
    <button class="round-btn ghost" id="attach-btn" onclick="document.getElementById('file-input').click()" title="Ekle">📎</button>
    <button class="round-btn" id="send-btn" onclick="sendCurrent()" title="Gönder">🎙</button>`;
}

// ── YENİ SOHBET / KİŞİ EKLE ──────────────────────────────────────
let ncAllContacts = [];

function openNewChatModal() {
  document.getElementById('nc-name').value = '';
  document.getElementById('nc-phone').value = '';
  document.getElementById('nc-pick-search').value = '';
  document.getElementById('nc-err').textContent = '';
  setNcTab('pick');
  document.getElementById('new-chat-modal').style.display = 'flex';
  loadPickList();
}
function closeNewChatModal() { document.getElementById('new-chat-modal').style.display = 'none'; }

function setNcTab(tab) {
  document.getElementById('nc-tab-pick').classList.toggle('active', tab === 'pick');
  document.getElementById('nc-tab-manual').classList.toggle('active', tab === 'manual');
  document.getElementById('nc-pick-pane').style.display = tab === 'pick' ? 'block' : 'none';
  document.getElementById('nc-manual-pane').style.display = tab === 'manual' ? 'block' : 'none';
}

async function loadPickList() {
  document.getElementById('nc-pick-list').innerHTML = '<div class="empty-hint" style="padding:16px 4px">Yükleniyor...</div>';
  const data = await api('/api/contacts');
  ncAllContacts = data.contacts || [];
  renderPickList();
}

function renderPickList() {
  const q = (document.getElementById('nc-pick-search').value || '').trim().toLocaleLowerCase('tr');
  const el = document.getElementById('nc-pick-list');
  if (!ncAllContacts.length) {
    el.innerHTML = '<div class="empty-hint" style="padding:16px 4px">Rehberde kayıtlı kişi yok.<br>"Manuel Ekle" sekmesinden ekleyebilirsiniz.</div>';
    return;
  }
  const list = q ? ncAllContacts.filter(c => c.name.toLocaleLowerCase('tr').includes(q) || c.phone.includes(q)) : ncAllContacts;
  if (!list.length) { el.innerHTML = '<div class="empty-hint" style="padding:16px 4px">Sonuç bulunamadı.</div>'; return; }
  el.innerHTML = list.map(c => `
    <div class="conv-item" onclick="pickContact('${c.phone}')">
      <div class="avatar">${esc(c.name.trim()[0]?.toUpperCase() || '?')}</div>
      <div class="conv-info"><div class="conv-name">${esc(c.name)}</div><div class="conv-prev">${esc(c.phone)}</div></div>
    </div>`).join('');
}

async function pickContact(phone) {
  closeNewChatModal();
  await loadConversations();
  openConversation(phone);
}

async function createNewChat() {
  const name = document.getElementById('nc-name').value.trim();
  const phone = document.getElementById('nc-phone').value.trim().replace(/\D/g, '');
  const errEl = document.getElementById('nc-err');
  if (!name || phone.length < 10) { errEl.textContent = 'Ad ve geçerli telefon gerekli'; return; }
  const data = await api('/api/contacts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, phone }) });
  if (!data.ok) { errEl.textContent = data.error || 'Eklenemedi'; return; }
  closeNewChatModal();
  await loadConversations();
  openConversation(data.contact.phone);
}
</script>
